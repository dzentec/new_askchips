<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" fill="none">
  <!-- Brand Silicon Emblem -->
  <g transform="translate(4, 3)">
    <rect width="48" height="48" rx="12" fill="#0f172a"/>
    <!-- PCB Pin Leads -->
    <path d="M8 18H5M8 24H3M8 30H5M40 18H43M40 24H45M40 30H43M18 8V5M24 8V3M30 8V5M18 40V43M24 40V45M30 40V43" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <!-- Silicon Substrate -->
    <rect x="10" y="10" width="28" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Die Accent Core -->
    <rect x="16" y="16" width="16" height="16" rx="3.5" fill="#2563eb"/>
    <!-- Trace lines -->
    <path d="M19 24H29M24 19V29" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Verified Emerald Indicator -->
    <circle cx="29" cy="19" r="2" fill="#10b981"/>
  </g>

  <!-- Typography: AskChips -->
  <text x="64" y="32" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a" letter-spacing="-0.5">
    Ask<tspan fill="#2563eb">Chips</tspan>
  </text>
  <!-- Technical Subtitle -->
  <text x="65" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" fill="#64748b" letter-spacing="1.2">
    COMPONENTS &amp; PCB
  </text>
</svg>

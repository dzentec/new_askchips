<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Request for Quote (RFQ) — AskChips</title>
  <meta name="description" content="Submit your BOM or PCB design files for immediate review and competitive quote turnaround within 24 hours. Global engineering support.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
  <div id="global-header"></div>

  <main class="flex-grow">
    <!-- Header Hero -->
    <section class="bg-white border-b border-slate-200/80 bg-grid-pattern py-16 lg:py-20">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-md bg-blue-50 border border-blue-200 text-blue-700 text-xs font-mono font-medium mb-4">
          INQUIRY & SUPPORT
        </div>
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-slate-900">
          Request a Quote / Contact Sales
        </h1>
        <p class="mt-4 text-lg text-slate-600 max-w-2xl">
          Upload your BOM file or project specifications. Our dedicated technical account managers respond with full pricing and lead-times within 24 hours.
        </p>
      </div>
    </section>
  </main>

  <div id="global-footer"></div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
